seed: 1
device: cuda
output_dir: outputs/dsga_resnet10

data:
  image_size: 224
  source:
    # miniImageNet training split: class folders under this directory.
    folder: data/miniimagenet/train
    manifest: null
    root: null
    split: train
  target:
    # ChestX is used only by evaluate.py, never by either training stage.
    folder: null
    manifest: data/manifests/chestx.csv
    root: null
    split: test
  generated:
    folder: data/generated
    qc_manifest: data/generated/qc_manifest.csv

model:
  architecture: resnet10
  # Layer1, Layer2, Layer3, Layer4; exactly as reported in the manuscript.
  layer_weights: [0.1, 0.27, 0.189, 0.441]
  temperature: 0.1

augmentation:
  clip_limit: 4.0
  tile_grid: 8
  blur_kernel: 13

collaborative:
  epochs: 400
  batch_size: 64
  workers: 4
  learning_rate: 0.001
  momentum: 0.9
  weight_decay: 0.0005
  augmented_loss_weight: 1.0

meta_train:
  episodes: 1200
  episodes_per_batch: 4
  ways: 5
  shots: 5
  queries: 15
  learning_rate: 0.01
  momentum: 0.9
  weight_decay: 0.001
  save_every: 100

evaluation:
  episodes: 600
  ways: 5
  shots: [1, 5, 20, 50]
  queries: 15
  # The paper creates a pool of 8 generated images/class and samples one
  # auxiliary support/class/episode for its controlled 1-shot+GA protocol.
  generated_per_class: 1

