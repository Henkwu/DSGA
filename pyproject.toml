[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dsga"
version = "1.0.0"
description = "Domain-Specific Generative Augmentation for cross-domain few-shot chest X-ray recognition"
requires-python = ">=3.10,<3.13"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["dsga"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

